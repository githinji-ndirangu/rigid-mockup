<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview · Rigid Group</title>
  <meta name="description" content="Rigid Group management workspace for auctioneers and yard operations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"]
          }
        }
      }
    };
  </script>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body data-page="overview" class="h-screen overflow-hidden bg-white font-sans text-[#171717] dark:text-[#F3F4F6]">
  <div id="app"></div>

  <template id="page-content">
    <div class="flex flex-1 flex-col">
      <div class="flex flex-wrap items-start justify-between gap-5">
        <div class="min-w-0">
          <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-[#a3a39e] dark:text-[#9CA3AF]">Workspace</p>
          <h1 class="mt-2 text-3xl font-medium tracking-[-0.03em] text-[#141414] dark:text-[#F3F4F6]">Overview</h1>
          <p class="mt-2.5 max-w-xl text-sm leading-6 text-[#85857f] dark:text-[#9CA3AF]">
            A single view of repossessions, yard stock and sales across Rigid Auctioneers and Rigid Motors.
          </p>
        </div>

        <div class="flex shrink-0 items-center pt-1">
          <span class="inline-flex h-9 items-center gap-2 rounded-lg border border-[#e6e5df] dark:border-[#262B36] bg-white px-3.5 dark:border-[#262B36] dark:bg-[#171A21] text-[12px] font-medium text-[#6f6f6a] dark:text-[#9CA3AF] shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
            <svg class="h-3.5 w-3.5 text-[#9a9a94] dark:text-[#9CA3AF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="18" height="18" x="3" y="4" rx="2"></rect>
              <path d="M8 2v4"></path>
              <path d="M16 2v4"></path>
              <path d="M3 10h18"></path>
            </svg>
            <span id="overview-as-of">As at 30 Oct 2026</span>
          </span>
        </div>
      </div>

      <div id="overview-stats" class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4"></div>

      <div class="mt-5 grid flex-1 grid-cols-1 gap-5 lg:grid-cols-2">
        <section id="pipeline-card"></section>
        <section id="attention-card"></section>
      </div>
    </div>
  </template>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/overview.js"></script>
</body>
</html>
