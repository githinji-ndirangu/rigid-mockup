<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients · Rigid Group</title>
  <meta name="description" content="Client directory for Rigid Auctioneers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"]
          }
        }
      }
    };
  </script>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body data-page="clients" class="h-screen overflow-hidden bg-white font-sans text-[#171717] dark:text-[#F3F4F6]">
  <div id="app"></div>

  <template id="page-content">
    <div class="flex flex-1 flex-col">
      <div class="flex flex-wrap items-start justify-between gap-5">
        <div class="min-w-0">
          <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-[#a3a39e] dark:text-[#9CA3AF]">Rigid Auctioneers</p>
          <h1 class="mt-2 text-3xl font-medium tracking-[-0.03em] text-[#141414] dark:text-[#F3F4F6]">Clients</h1>
          <p class="mt-2.5 max-w-xl text-sm leading-6 text-[#85857f] dark:text-[#9CA3AF]">
            Banks, microfinance partners, law firms and individual clients who instruct the agency.
          </p>
        </div>
      </div>

      <div id="client-filters" class="mt-7"></div>
      <div id="clients-grid" class="mt-5"></div>
    </div>
  </template>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/pages/clients.js"></script>
</body>
</html>
