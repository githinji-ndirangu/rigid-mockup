<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoices · Rigid Group</title>
  <meta name="description" content="Proclamation, auction and client invoices for Rigid Auctioneers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"]
          }
        }
      }
    };
  </script>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body data-page="invoices" class="h-screen overflow-hidden bg-white font-sans text-[#171717] dark:text-[#F3F4F6]">
  <div id="app"></div>

  <template id="page-content">
    <div class="flex flex-1 flex-col">
      <div class="flex flex-wrap items-start justify-between gap-5">
        <div class="min-w-0">
          <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-[#a3a39e] dark:text-[#9CA3AF]">Rigid Auctioneers</p>
          <h1 class="mt-2 text-3xl font-medium tracking-[-0.03em] text-[#141414] dark:text-[#F3F4F6]">Invoices</h1>
          <p class="mt-2.5 max-w-xl text-sm leading-6 text-[#85857f] dark:text-[#9CA3AF]">
            Proclamation and auction charges issued to debtors, plus statements for clients.
          </p>
        </div>

        <div class="flex shrink-0 items-center gap-2 pt-1">
          <button type="button" id="import-invoices" class="inline-flex h-9 items-center gap-2 rounded-lg border border-[#e6e5df] dark:border-[#262B36] bg-white px-3.5 dark:border-[#262B36] dark:bg-[#171A21] text-[13px] font-medium text-[#3d3d39] dark:text-[#F3F4F6] shadow-[0_1px_2px_rgba(0,0,0,0.03)] transition hover:bg-[#fafaf8] dark:hover:bg-[#1D212A] focus:outline-none focus-visible:ring-2 focus-visible:ring-brand/30">
            <svg class="h-3.5 w-3.5 text-[#7a7a74] dark:text-[#9CA3AF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v12"></path>
              <path d="m7 10 5 5 5-5"></path>
              <path d="M5 21h14"></path>
            </svg>
            Import
          </button>
          <button type="button" id="export-invoices" class="inline-flex h-9 items-center gap-2 rounded-lg border border-[#e6e5df] dark:border-[#262B36] bg-white px-3.5 dark:border-[#262B36] dark:bg-[#171A21] text-[13px] font-medium text-[#3d3d39] dark:text-[#F3F4F6] shadow-[0_1px_2px_rgba(0,0,0,0.03)] transition hover:bg-[#fafaf8] dark:hover:bg-[#1D212A] focus:outline-none focus-visible:ring-2 focus-visible:ring-brand/30">
            <svg class="h-3.5 w-3.5 text-[#7a7a74] dark:text-[#9CA3AF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15V3"></path>
              <path d="m17 8-5-5-5 5"></path>
              <path d="M5 21h14"></path>
            </svg>
            Export
          </button>
        </div>
      </div>

      <div id="invoice-tabs" class="mt-6"></div>
      <div id="invoice-summary" class="mt-5"></div>
      <div id="invoices-table" class="mt-5"></div>
    </div>
  </template>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/pages/invoices.js"></script>
</body>
</html>
